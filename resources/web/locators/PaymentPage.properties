# ==============================================================
# PaymentPage Locators — WIRES FED Payment Creation
# Format: key={"locateBy":"xpath","locator":"<xpath>"}
# ==============================================================

create.payment.link={"locateBy":"xpath","locator":"//a[contains(text(),'Create Payment')]"}
payment.type.dropdown={"locateBy":"xpath","locator":"//select[@id='paymentType']"}
amount.field={"locateBy":"xpath","locator":"//input[@id='amount']"}
beneficiary.field={"locateBy":"xpath","locator":"//input[@id='beneficiary']"}
submit.button={"locateBy":"xpath","locator":"//button[@id='submitPayment']"}
success.message={"locateBy":"xpath","locator":"//div[contains(@class,'alert-success')]"}
reference.number={"locateBy":"xpath","locator":"//span[@id='refNumber']"}
cancel.button={"locateBy":"xpath","locator":"//button[@id='cancelPayment']"}
payment.status.label={"locateBy":"xpath","locator":"//label[@id='paymentStatus']"}
