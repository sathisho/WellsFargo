# ==============================================================
# CheckoutPage Locators — E-Commerce Application (TutorialsNinja)
# Format: key={"locateBy":"<strategy>","locator":"<value>"}
# ==============================================================

# Search
search.box={"locateBy":"css","locator":"input[placeholder='Search']"}
search.icon={"locateBy":"xpath","locator":"//button[@class='btn btn-default btn-lg']"}

# Product actions
add.to.cart.button={"locateBy":"xpath","locator":"//span[normalize-space()='Add to Cart']"}

# Success message
success.message={"locateBy":"css","locator":".alert.alert-success"}

# Cart
cart.items.list={"locateBy":"xpath","locator":"//span[@id='cart-total']"}
checkout.button={"locateBy":"xpath","locator":"//strong[normalize-space()='Checkout']"}

# Checkout warning
checkout.warning.message={"locateBy":"css","locator":".alert.alert-danger"}
