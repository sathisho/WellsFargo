# ==============================================================
# LoginPage Locators — WIRES Application
# Format: key={"locateBy":"xpath","locator":"<xpath>"}
# ==============================================================

username.field={"locateBy":"xpath","locator":"//input[@id='username']"}
password.field={"locateBy":"xpath","locator":"//input[@id='password']"}
login.button={"locateBy":"xpath","locator":"//button[@id='loginBtn']"}
welcome.message={"locateBy":"xpath","locator":"//span[contains(@class,'welcome-msg')]"}
forgot.password.link={"locateBy":"xpath","locator":"//a[contains(text(),'Forgot Password')]"}
error.message={"locateBy":"xpath","locator":"//div[contains(@class,'error-message')]"}
