<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WellsFargo Automation Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>🏦 WellsFargo Automation Dashboard</h1>
            <div id="meta-info">
                <span id="env-badge" class="badge">SIT</span>
                <span id="exec-date"></span>
            </div>
        </div>
    </header>

    <main>
        <!-- Summary Cards -->
        <section class="summary-cards">
            <div class="card total">
                <h3>Total</h3>
                <p id="total-count">0</p>
            </div>
            <div class="card passed">
                <h3>Passed ✅</h3>
                <p id="pass-count">0</p>
            </div>
            <div class="card failed">
                <h3>Failed ❌</h3>
                <p id="fail-count">0</p>
            </div>
            <div class="card skipped">
                <h3>Skipped ⏭️</h3>
                <p id="skip-count">0</p>
            </div>
            <div class="card rate">
                <h3>Pass Rate</h3>
                <p id="pass-rate">0%</p>
            </div>
            <div class="card duration">
                <h3>Duration</h3>
                <p id="duration">0s</p>
            </div>
        </section>

        <!-- Progress Bar -->
        <section class="progress-section">
            <div class="progress-bar">
                <div id="progress-pass" class="progress-fill pass"></div>
                <div id="progress-fail" class="progress-fill fail"></div>
                <div id="progress-skip" class="progress-fill skip"></div>
            </div>
        </section>

        <!-- Scenario Details Table -->
        <section class="details-section">
            <h2>📋 Scenario Details</h2>
            <table id="scenario-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Feature</th>
                        <th>Scenario</th>
                        <th>Status</th>
                        <th>Duration</th>
                        <th>Error</th>
                    </tr>
                </thead>
                <tbody id="scenario-body">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </section>

        <!-- Meta Information -->
        <section class="meta-section">
            <h2>ℹ️ Execution Info</h2>
            <div id="meta-details"></div>
        </section>
    </main>

    <footer>
        <p>WellsFargo Enterprise Automation Framework &copy; 2026 | Generated automatically from test-results/</p>
    </footer>

    <script src="js/dashboard.js"></script>
</body>
</html>
