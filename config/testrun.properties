# ==============================================================
# Test Run Configuration
# Controls runtime behavior for current test execution
# ==============================================================

# Execution Mode
execution.mode=local
execution.parallel=false
execution.thread.count=1

# BDD Configuration
step.provider.pkg=com.wellsfargo.steps
scenario.file.loc=scenarios

# Default Tags
default.tags=@Smoke

# Data Configuration
testdata.dir=resources-testdata
locator.dir=resources/web/locators

# Suite Configuration
suite.default=Smoke.yaml
