# ==============================================================
# WellsFargo Enterprise Automation Framework
# Global Application Configuration
# ==============================================================

# Application
app.name=WellsFargo WIRES
app.version=1.0

# Default Environment (overridden by -Denv=SIT|UAT)
env.default=SIT

# Browser Configuration
driver.name=chromeDriver
selenium.wait.timeout=20
selenium.implicit.wait=10
selenium.page.load.timeout=60

# Reporting
reporting.enabled=true
reporting.output.dir=test-results
dashboard.output.dir=dashboard

# Screenshots
screenshot.on.failure=true
screenshot.dir=test-results/screenshots

# Logging
log.level=INFO
log.dir=test-results/logs

# Retry Configuration
retry.count=1
retry.on.failure=true
