# ==============================================================
# UAT Environment Configuration
# Usage: mvn clean test -Denv=UAT
# ==============================================================

env.name=UAT
env.baseUrl=https://wires-uat.wellsfargo.com
env.api.baseUrl=https://api-uat.wellsfargo.com

# UAT Credentials
env.username=uat_automation_user
