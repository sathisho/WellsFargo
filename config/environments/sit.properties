# ==============================================================
# SIT Environment Configuration
# Usage: mvn clean test -Denv=SIT
# ==============================================================

env.name=SIT
env.baseUrl=https://wires-sit.wellsfargo.com
env.api.baseUrl=https://api-sit.wellsfargo.com

# SIT Credentials (externalized — use Jenkins/Vault in production)
env.username=sit_automation_user
env.password=sit_automation_pass

# SIT Database (for validation queries)
env.db.host=sit-db.wellsfargo.internal
env.db.port=1521
env.db.name=WIRESIT

# SIT-specific timeouts
env.timeout.page=30
env.timeout.element=15
