name: 🚀 HyperExecute - Cloud Tests

# Manual trigger + scheduled nightly run
on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test Suite to Run'
        required: true
        default: 'All'
        type: choice
        options:
          - Smoke
          - Regression
          - All
  schedule:
    # Nightly regression at 11:30 PM IST (6:00 PM UTC)
    - cron: '0 18 * * 1-5'

jobs:
  hyperexecute:
    name: 🚀 HyperExecute Cloud Execution
    runs-on: ubuntu-latest

    env:
      LT_USERNAME: ${{ secrets.LT_USERNAME }}
      LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 📦 Download HyperExecute CLI
        run: |
          curl -L -o hyperexecute https://downloads.lambdatest.com/hyperexecute/linux/hyperexecute
          chmod +x hyperexecute

      - name: 🚀 Run Tests on HyperExecute
        run: |
          ./hyperexecute \
            --user "${{ secrets.LT_USERNAME }}" \
            --key "${{ secrets.LT_ACCESS_KEY }}" \
            --config hyperexecute.yaml

      - name: 📊 Upload HyperExecute Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperexecute-reports
          path: |
            src/test/resources/reports/
            target/qmetry-reports/
          retention-days: 30

      - name: 📋 Print Job Summary
        if: always()
        run: |
          echo "## 🚀 HyperExecute Execution Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Type:** ${{ github.event.inputs.test_type || 'Nightly Regression' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dashboard:** [View on LambdaTest](https://hyperexecute.lambdatest.com)" >> $GITHUB_STEP_SUMMARY
